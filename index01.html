<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রো ডিজিটাল প্ল্যাটফর্ম</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: rgba(22, 27, 34, 0.75);
            --primary-glow: linear-gradient(135deg, #7c3aed, #06b6d4);
            --neon-border: rgba(124, 58, 237, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* animated background lights */
        .lighting-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-1 { top: -10%; left: 20%; width: 400px; height: 400px; background: #7c3aed; }
        .orb-2 { bottom: -10%; right: 15%; width: 450px; height: 450px; background: #06b6d4; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-50px) scale(1.1); }
        }

        /* navbar */
        header {
            background: rgba(10, 12, 16, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--neon-border);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 800; background: var(--primary-glow); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-btns { display: flex; gap: 12px; }

        .btn {
            padding: 10px 20px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; font-size: 14px;
        }
        .btn-glow {
            background: var(--primary-glow); color: #fff;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
        }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(6, 182, 212, 0.6); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--neon-border); }
        .btn-danger { background: #ef4444; color: #fff; }

        /* main container */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; flex: 1; }

        /* cards glassmorphism */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--neon-border);
            border-radius: 20px; padding: 30px; margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* forms styling */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted); }
        .form-control {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-border);
            color: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }

        /* grid layouts */
        .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .post-card {
            background: var(--card-bg); border: 1px solid var(--neon-border);
            border-radius: 16px; padding: 20px; position: relative; transition: 0.3s;
        }
        .post-card:hover { transform: translateY(-50px scale(1.02)); border-color: #06b6d4; }

        /* auth forms toggle */
        .auth-container { max-width: 420px; margin: 40px auto; }
        .hidden { display: none !important; }

        /* footer copyright */
        footer {
            text-align: center; padding: 25px;
            background: rgba(10, 12, 16, 0.9);
            border-top: 1px solid var(--neon-border);
            color: var(--text-muted); font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="lighting-bg">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <!-- header -->
    <header>
        <div class="logo"><i class="fa-solid fa-bolt"></i> PRO PLATFORM</div>
        <div class="nav-btns">
            <span id="userInfo" style="margin-right:10px; align-self:center; font-weight:600;"></span>
            <button class="btn btn-outline hidden" id="btnLogout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
            <button class="btn btn-glow" id="btnAuthNav" onclick="toggleAuthModal()"><i class="fa-solid fa-user"></i> একাউন্ট / লগইন</button>
        </div>
    </header>

    <div class="container">

        <!-- ইউজার সাইন-আপ ও লগইন কার্ড -->
        <div id="authSection" class="glass-card auth-container hidden">
            <h2 id="authTitle" style="text-align: center; margin-bottom: 20px;">রেজিস্ট্রেশন করুন</h2>
            
            <form id="authForm">
                <div class="form-group" id="nameGroup">
                    <label>আপনার নাম</label>
                    <input type="text" id="regName" class="form-control" placeholder="আপনার নাম লিখুন">
                </div>
                <div class="form-group">
                    <label>ইমেইল এড্রেস</label>
                    <input type="email" id="authEmail" class="form-control" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="authPass" class="form-control" placeholder="******" required>
                </div>
                <button type="button" class="btn btn-glow" style="width:100%; justify-content:center;" onclick="handleAuth()">সম্পন্ন করুন</button>
            </form>
            
            <p style="text-align:center; margin-top:15px; font-size:14px; color:var(--text-muted);">
                <span id="authToggleText">একাউন্ট আছে?</span> 
                <a href="#" style="color:#06b6d4; font-weight:600;" onclick="switchAuthMode()">এখানে ক্লিক করুন</a>
            </p>
        </div>

        <!-- এডমিন এডিটর (শুধুমাত্র এডমিন ব্যবহার করতে পারবে) -->
        <div id="adminPanel" class="glass-card hidden">
            <h3><i class="fa-solid fa-pen-to-square"></i> কন্টেন্ট এডিটর (এডমিন প্যানেল)</h3>
            <br>
            <input type="hidden" id="editPostId">
            <div class="form-group">
                <label>পোস্টের শিরোনাম</label>
                <input type="text" id="postTitle" class="form-control" placeholder="শিরোনাম লিখুন...">
            </div>
            <div class="form-group">
                <label>বিস্তারিত বিবরণ</label>
                <textarea id="postContent" class="form-control" rows="4" placeholder="আপনার বিবরণ লিখুন..."></textarea>
            </div>
            <button class="btn btn-glow" onclick="savePost()"><i class="fa-solid fa-cloud-arrow-up"></i> সেভ / পাবলিশ করুন</button>
        </div>

        <!-- পাবলিক পোস্ট লিস্ট -->
        <div class="glass-card">
            <h2><i class="fa-solid fa-newspaper"></i> সাম্প্রতিক পোস্টসমূহ</h2>
            <br>
            <div class="post-grid" id="postsContainer">
                <p>পোস্ট লোড হচ্ছে...</p>
            </div>
        </div>

    </div>

    <!-- কপিরাইট ফুটার -->
    <footer>
        <p>&copy; 2026 PRO PLATFORM. সর্বস্বত্ব সংরক্ষিত। সর্বমোট প্রযুক্তিগত সুরক্ষাধীন।</p>
    </footer>

    <!-- Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvUrskx4nuEZ-Bh7V8p80u9GpO7barUR4",
            authDomain: "mehedi-hasan-944f2.firebaseapp.com",
            projectId: "mehedi-hasan-944f2",
            storageBucket: "mehedi-hasan-944f2.firebasestorage.app",
            messagingSenderId: "781590059447",
            appId: "1:781590059447:web:7618364c581362982bb032"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let isLoginMode = false;
        let currentUser = null;

        // এডমিনের ইমেইল আইডি (প্রয়োজনে নিজের ইমেইল দিয়ে চেঞ্জ করুন)
        const ADMIN_EMAIL = "admin@gmail.com";

        // অথেন্টিকেশন স্টেট পরিবর্তন
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('userInfo').textContent = user.email;
                document.getElementById('btnLogout').classList.remove('hidden');
                document.getElementById('btnAuthNav').classList.add('hidden');
                document.getElementById('authSection').classList.add('hidden');

                // এডমিন রোল চেক
                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('adminPanel').classList.remove('hidden');
                } else {
                    document.getElementById('adminPanel').classList.add('hidden');
                }
            } else {
                document.getElementById('userInfo').textContent = '';
                document.getElementById('btnLogout').classList.add('hidden');
                document.getElementById('btnAuthNav').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
            }
            loadPosts();
        });

        // রেজিস্টার / লগইন হ্যান্ডলার
        window.handleAuth = async function() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, pass);
                    alert("লগইন সফল হয়েছে!");
                } else {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    alert("একাউন্ট সফলভাবে তৈরি হয়েছে!");
                }
            } catch (err) {
                alert("ত্রুটি: " + err.message);
            }
        };

        window.logout = function() {
            signOut(auth);
        };

        // পোস্ট সেভ এবং আপডেট (CRUD)
        window.savePost = async function() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const editId = document.getElementById('editPostId').value;

            if (!title || !content) { alert('সবগুলো ফিল্ড পূরণ করুন!'); return; }

            try {
                if (editId) {
                    await updateDoc(doc(db, "posts", editId), { title, content });
                    document.getElementById('editPostId').value = '';
                    alert("পোস্ট আপডেট হয়েছে!");
                } else {
                    await addDoc(collection(db, "posts"), {
                        title, content, created: serverTimestamp()
                    });
                    alert("নতুন পোস্ট সেভ হয়েছে!");
                }
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                loadPosts();
            } catch (err) {
                alert("ত্রুটি: " + err.message);
            }
        };

        // পোস্ট রিড/লোড
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            try {
                const q = query(collection(db, "posts"), orderBy("created", "desc"));
                const snap = await getDocs(q);
                let html = '';

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    html += `
                        <div class="post-card">
                            <h3>${data.title}</h3>
                            <p style="margin-top:10px; color:var(--text-muted);">${data.content}</p>
                            ${isAdmin ? `
                                <div style="margin-top:15px; display:flex; gap:10px;">
                                    <button class="btn btn-outline" style="padding:4px 10px; font-size:12px;" onclick="editPost('${id}', '${data.title}', '${data.content}')">এডিট</button>
                                    <button class="btn btn-danger" style="padding:4px 10px; font-size:12px;" onclick="deletePost('${id}')">ডিলিট</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                container.innerHTML = html || '<p>কোনো পোস্ট পাওয়া যায়নি।</p>';
            } catch (e) {
                container.innerHTML = '<p>পোস্ট লোড করতে সমস্যা হচ্ছে।</p>';
            }
        }

        window.editPost = function(id, title, content) {
            document.getElementById('editPostId').value = id;
            document.getElementById('postTitle').value = title;
            document.getElementById('postContent').value = content;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deletePost = async function(id) {
            if (confirm("আপনি কি নিশ্চিত এটি ডিলিট করতে চান?")) {
                await deleteDoc(doc(db, "posts", id));
                loadPosts();
            }
        };
    </script>

    <script>
        function toggleAuthModal() {
            document.getElementById('authSection').classList.toggle('hidden');
        }
        function switchAuthMode() {
            const isLoginMode = document.getElementById('authTitle').innerText === "লগইন করুন";
            document.getElementById('authTitle').innerText = isLoginMode ? "রেজিস্ট্রেশন করুন" : "লগইন করুন";
            document.getElementById('nameGroup').style.display = isLoginMode ? "block" : "none";
            document.getElementById('authToggleText').innerText = isLoginMode ? "একাউন্ট আছে?" : "নতুন একাউন্ট করতে চান?";
        }
    </script>
</body>
</html>
